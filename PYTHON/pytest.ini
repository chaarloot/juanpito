[pytest]
# Configuración de pytest para VitaliaCJ

# Directorio de tests
testpaths = tests

# Patrones de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output detallado
addopts = -v --tb=short --strict-markers

# Markers personalizados
markers =
    auth: Tests de autenticación
    schemas: Tests de validaciones
    endpoints: Tests de endpoints API
    slow: Test que toma mucho tiempo
