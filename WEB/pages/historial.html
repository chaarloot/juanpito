<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial — Vitalia JC</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/app-extra.css">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="page active">
            <div class="page-header">
                <div>
                    <h1>HISTORIAL</h1>
                    <div class="page-subtitle">
                        <span id="historialCount">—</span> entrenamientos
                    </div>
                </div>
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
                    <input type="text" id="filtroTipo" placeholder="🔍 Filtrar por tipo…" class="search-input" style="max-width:200px">
                    <select id="filtroDias" class="inline-select">
                        <option value="7">7 días</option>
                        <option value="30" selected>30 días</option>
                        <option value="90">90 días</option>
                        <option value="365">1 año</option>
                    </select>
                    <button id="btnNewWorkout" class="btn-primary">+ Nuevo</button>
                </div>
            </div>
            <div id="historialList" class="history-list"></div>
        </div>
    </main>
</div>
<script src="/config.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/historial.js"></script>
</body>
</html>
