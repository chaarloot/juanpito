<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción — Vitalia JC</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/app-extra.css">
</head>
<body>
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
        <div class="page active">

            <div class="page-header">
                <h1>📉 PREDICCIÓN</h1>
                <button class="btn-primary" onclick="runAnalysis()">↻ Actualizar análisis</button>
            </div>

            <p style="color:#a0a0a0;margin-bottom:28px;font-size:14px">
                Basado en tus datos reales de entrenamiento y métricas, el sistema estima tu progreso futuro usando regresión lineal.
            </p>

            <!-- OBJETIVO ACTUAL -->
            <div class="pred-objetivo-wrap">
                <div class="chart-header" style="margin-bottom:16px">
                    <h3>🎯 DEFINE TU OBJETIVO</h3>
                </div>
                <div class="pred-objetivo-grid">
                    <div class="pred-objetivo-btn active" data-obj="peso" onclick="setObjetivo('peso')">
                        <span>⚖️</span><span>Bajar peso</span>
                    </div>
                    <div class="pred-objetivo-btn" data-obj="musculo" onclick="setObjetivo('musculo')">
                        <span>💪</span><span>Ganar músculo</span>
                    </div>
                    <div class="pred-objetivo-btn" data-obj="resistencia" onclick="setObjetivo('resistencia')">
                        <span>🏃</span><span>Resistencia</span>
                    </div>
                    <div class="pred-objetivo-btn" data-obj="habito" onclick="setObjetivo('habito')">
                        <span>📋</span><span>Consistencia</span>
                    </div>
                </div>
            </div>

            <!-- RESULTADO PREDICCIÓN -->
            <div id="predResult" style="margin-top:24px">
                <p class="loading-text">Analizando tus datos…</p>
            </div>

            <!-- GRÁFICO DE TENDENCIA -->
            <div class="progress-chart" style="margin-top:24px">
                <div class="chart-header"><h3>TENDENCIA DE ENTRENAMIENTOS</h3></div>
                <div style="height:260px;position:relative">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <!-- INSIGHTS -->
            <div id="insightsWrap" style="margin-top:24px"></div>

        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/config.js"></script>
<script src="../js/shared.js"></script>
<script src="../js/prediccion.js"></script>
</body>
</html>
